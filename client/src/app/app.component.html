<div class="container-fluid">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/pessoas']"><i class="fa fa-user-edit"></i></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" [routerLink]="['/pessoas/listar']">Pessoas</a>
          </li>
          <li class="nav-item" *ngIf="usuarioLogado.perfil ==='GERENTE'">
            <a class="nav-link" [routerLink]="['/cidades/listar']">Cidades</a>
          </li>
          <li class="nav-item" *ngIf="usuarioLogado.perfil ==='ADMIN' || usuarioLogado.perfil ==='GERENTE'">
            <a class="nav-link" [routerLink]="['/endereco/listar']">Endereços</a>
          </li>  
          <li class="nav-item dropdown">
            <a class="nav-link active dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Cadastros
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
              <li><a class="dropdown-item" [routerLink]="['/pessoas/novo']" (click)="$event.preventDefault()">Pessoa</a></li>
              <li><a class="dropdown-item" [routerLink]="['/cidades/novo']" (click)="$event.preventDefault()" *ngIf="usuarioLogado.perfil ==='GERENTE'">Cidade</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" [routerLink]="['/endereco/novo']" (click)="$event.preventDefault()" *ngIf="usuarioLogado.perfil ==='ADMIN' || usuarioLogado.perfil ==='GERENTE'">Endereço</a></li>
            </ul>
          </li>        
        </ul>
        <ul *ngIf="usuarioLogado" class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" (click)="logout()">Logout</a>
          </li>
          <li class="nav-item">
            <p class="navbar-text mb-0 text-white">
              <i class="fa fa-user"></i>{{ usuarioLogado.nome }}
            </p>
          </li>
        </ul>
      </div>
    </div>
  </nav>

    <div class="container-fluid">
      <div class="navbar-header">
        <a href="" class="navbar-brand">{{ title }}</a>
      </div>
    </div>
  </nav>-->

</div>
